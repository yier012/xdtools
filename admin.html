<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台管理 - XD團工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

  <div class="page">
    <header class="topbar">
      <div>
        <h1 class="logo">後台管理</h1>
        <p class="greeting">只有知道密碼的人才可以編輯</p>
      </div>
      <a href="index.html" class="settings-btn" aria-label="回首頁">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </a>
    </header>

    <section id="login-view" class="login-view">
      <form id="login-form" class="login-form">
        <label for="password-input">後台密碼</label>
        <input type="password" id="password-input" autocomplete="current-password" required>
        <button type="submit">登入</button>
        <p id="login-error" class="login-error"></p>
      </form>
    </section>

    <section id="editor-view" class="editor-view" hidden>
      <h2 class="section-title">人員名單</h2>

      <div class="edit-list-header">
        <span>頭貼照片</span>
        <span>暱稱</span>
        <span>生日</span>
        <span>身分</span>
        <span></span>
      </div>
      <div id="member-edit-list" class="edit-list"></div>

      <button type="button" id="add-member-btn" class="add-btn">+ 新增成員</button>

      <div class="save-bar">
        <button type="button" id="save-btn" class="save-btn">儲存變更</button>
        <span id="save-status" class="save-status"></span>
      </div>
    </section>
  </div>

  <div id="crop-modal" class="crop-modal" hidden>
    <div class="crop-modal-inner">
      <div class="crop-image-wrapper">
        <img id="crop-image" src="" alt="">
      </div>
      <div class="crop-modal-actions">
        <button type="button" id="crop-cancel-btn" class="crop-cancel-btn">取消</button>
        <button type="button" id="crop-confirm-btn" class="crop-confirm-btn">確定</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
